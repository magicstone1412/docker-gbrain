---
services:
  gbrain-postgres:
    image: pgvector/pgvector:pg16
    container_name: gbrain-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gbrain
      POSTGRES_USER: gbrain
      POSTGRES_PASSWORD: gbrain123
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gbrain -d gbrain"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - gbrain-net

  gbrain:
    # IMPORTANT: this entrypoint (GBRAIN_MODE support) is baked into the image,
    # so use a NEW tag. The old tag v0.60.310.0 holds the previous entrypoint,
    # which ignores GBRAIN_MODE and would run the classic loops on a managed
    # brain. Build and push this tag first (see Dockerfile); until then this
    # fails loudly on pull instead of silently running the wrong entrypoint.
    image: skywirex/gbrain:latest
    init: true                # reap zombies and forward signals to the background loops
    stop_grace_period: 60s    # let serve and workers drain before SIGKILL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    container_name: gbrain
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://gbrain:gbrain123@gbrain-postgres:5432/gbrain
      # Changing this back to classic requires `gbrain sources writer deactivate`
      # first; classic sync is refused on an activated managed brain.
      GBRAIN_MODE: managed
      # Managed brains never pull by themselves. Set to true to run
      # `gbrain sources refresh` before every sync cycle so commits pushed to
      # origin from another machine reach this checkout (fast-forward only).
      # While a refresh drains writes, a page write can be refused for a moment.
      GBRAIN_REFRESH_UPSTREAM: ${GBRAIN_REFRESH_UPSTREAM:-false}
      # Optional overrides (defaults: /data/brain and default). Leave them
      # unset unless you are building a NEW brain with another layout: on a
      # managed brain BRAIN_DIR must equal the claimed path, otherwise the
      # container refuses to start. The volume mounts below must follow it, and
      # the parent of BRAIN_DIR must also be a persistent mount (reservation).
      # BRAIN_DIR: ${BRAIN_DIR:-/data/brain}
      # GBRAIN_SOURCE_ID: ${GBRAIN_SOURCE_ID:-default}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      # Optional. Uncomment if you don't set OPENAI_API_KEY above — autopilot's
      # chat-dependent phases (chronicle/dream/enrich) need Anthropic OR OpenAI;
      # VOYAGE_API_KEY alone only satisfies the embedding requirement.
      # ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SYNC_INTERVAL: ${SYNC_INTERVAL:-600}
      # Maximum USD per non-interactive background embedding run.
      EMBED_MAX_USD_PER_RUN: ${EMBED_MAX_USD_PER_RUN-1}
      # --- Autopilot daemon ---
      # Default: on. The entrypoint runs `gbrain autopilot --install` (target is
      # auto-detected; inside Docker it writes ~/.gbrain/start-autopilot.sh, kept on
      # the ./.config volume) and starts it on every container start. The daemon owns
      # the jobs worker, so no standalone `gbrain jobs work` is started. Set to
      # false to disable it (the entrypoint then starts a standalone worker).
      # Needs VOYAGE_API_KEY or OPENAI_API_KEY; its chat phases (chronicle/dream/
      # enrich) also need OPENAI_API_KEY or ANTHROPIC_API_KEY.
      # Operate it from the host and never start a second daemon by hand:
      #   docker exec gbrain gbrain autopilot --status --json
      #   docker exec gbrain gbrain autopilot pause --reason "<why>"   (then: resume)
      # Changing this value needs `docker compose up -d` to recreate the container.
      AUTOPILOT_ENABLED: ${AUTOPILOT_ENABLED:-true}
      # Optional: URL that the Hermes host actually calls (OAuth issuer).
      # GBRAIN_PUBLIC_URL: ${GBRAIN_PUBLIC_URL:-}
      # SSH remote URL — set as origin and tracked by the current branch.
      BRAIN_REMOTE: ${BRAIN_REMOTE:-}
      # Use a writable known_hosts because the ~/.ssh mount below is read-only.
      GIT_SSH_COMMAND: "ssh -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/tmp/known_hosts"
    ports:
      # Reachable from the separate Hermes host over the network. Since this
      # is no longer loopback/internal-bridge-only, restrict at the firewall
      # (or bind a private VPN/Tailscale IP instead of 0.0.0.0) to only the
      # Hermes machine's address.
      - "7333:7333"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./state:/data
      - ./brain:/data/brain
      - ./.config:/root/.gbrain
      - ${HOME}/.ssh:/root/.ssh:ro
    depends_on:
      gbrain-postgres:
        condition: service_healthy
    networks:
      - gbrain-net

networks:
  gbrain-net:
    driver: bridge

volumes:
  postgres-data: