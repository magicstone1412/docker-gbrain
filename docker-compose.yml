---
services:
  gbrain-postgres:
    image: pgvector/pgvector:pg16
    container_name: gbrain-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gbrain
      POSTGRES_USER: gbrain
      POSTGRES_PASSWORD: gbrain123
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gbrain -d gbrain"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - gbrain-net

  gbrain:
    # IMPORTANT: this entrypoint (GBRAIN_MODE support) is baked into the image,
    # so use a NEW tag. The old tag v0.60.310.0 holds the previous entrypoint,
    # which ignores GBRAIN_MODE and would run the classic loops on a managed
    # brain. Build and push this tag first (see Dockerfile); until then this
    # fails loudly on pull instead of silently running the wrong entrypoint.
    image: skywirex/gbrain:latest
    init: true                # reap zombies and forward signals to the background loops
    stop_grace_period: 60s    # let serve and workers drain before SIGKILL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    container_name: gbrain
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://gbrain:gbrain123@gbrain-postgres:5432/gbrain?sslmode=disable
      # Changing this back to classic requires `gbrain sources writer deactivate`
      # first; classic sync is refused on an activated managed brain.
      GBRAIN_MODE: managed
      GBRAIN_REFRESH_UPSTREAM: ${GBRAIN_REFRESH_UPSTREAM:-true}
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      # Optional. Uncomment if you don't set OPENAI_API_KEY above — autopilot's
      # chat-dependent phases (chronicle/dream/enrich) need Anthropic OR OpenAI;
      # VOYAGE_API_KEY alone only satisfies the embedding requirement.
      # ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SYNC_INTERVAL: ${SYNC_INTERVAL:-600}
      # Maximum USD per non-interactive background embedding run.
      EMBED_MAX_USD_PER_RUN: ${EMBED_MAX_USD_PER_RUN-1}
      # --- Autopilot daemon ---
      # Set AUTOPILOT_ENABLED=true to run gbrain autopilot in the background.
      AUTOPILOT_ENABLED: ${AUTOPILOT_ENABLED:-true}
      # Optional: URL that the Hermes host actually calls (OAuth issuer).
      # GBRAIN_PUBLIC_URL: ${GBRAIN_PUBLIC_URL:-}
      # SSH remote URL — set as origin and tracked by the current branch.
      BRAIN_REMOTE: ${BRAIN_REMOTE:-}
      # --- Run as root OR non-root ---
      # PUID/PGID unset (or 0): run as root, exactly like before.
      # PUID/PGID set: the entrypoint starts as root, chowns ./brain, ./state
      # and ./.config to that uid:gid, then drops privileges. Set them to the
      # owner of the host files, ideally your own user (put PUID=$(id -u) and
      # PGID=$(id -g) in .env) so the mounted SSH key is readable too.
      # (Alternative without any chown: `user: "1000:1000"` on this service,
      # with the host dirs already owned by that uid.)
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      # Home and config location, identical for root and non-root (also set in
      # the Dockerfile). The volume mounts below must target this path.
      GBRAIN_HOME: /home/gbrain
      # SSH is configured by the entrypoint: it copies the mounted keys to
      # /home/gbrain/.ssh-runtime (0700, keys 0600) and writes an ssh_config the
      # image includes system-wide, so the :ro mount works for any uid, also in
      # `docker exec` shells. GIT_SSH_COMMAND no longer needs to be set here.
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: safe.directory
      GIT_CONFIG_VALUE_0: /data/brain
    ports:
      # Reachable from the separate Hermes host over the network. Since this
      # is no longer loopback/internal-bridge-only, restrict at the firewall
      # (or bind a private VPN/Tailscale IP instead of 0.0.0.0) to only the
      # Hermes machine's address.
      - "7333:7333"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./state:/data
      - ./brain:/data/brain
      - ./.config:/home/gbrain/.gbrain
      # Compat mount, KEEP IT: the writer lock path was recorded as
      # /root/.gbrain/persistence/locks/<id>.lock while the container ran as
      # root, and gbrain never relocates a recorded lock (it always wins over
      # any env). Same host dir, second mount point, so the recorded path stays
      # valid. The entrypoint makes /root traversable (chmod o+x) for the
      # non-root writer.
      - ./.config:/root/.gbrain
      - ${HOME}/.ssh:/home/gbrain/.ssh:ro
    depends_on:
      gbrain-postgres:
        condition: service_healthy
    networks:
      - gbrain-net

networks:
  gbrain-net:
    driver: bridge

volumes:
  postgres-data: