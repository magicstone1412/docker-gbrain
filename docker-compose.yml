services:
  gbrain-postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: gbrain
      POSTGRES_PASSWORD: gbrain
      POSTGRES_DB: gbrain
    volumes:
      - gbrain-postgres-data:/var/lib/postgresql/data
    networks:
      - gbrain-network

  gbrain:
    build: .
    depends_on:
      - gbrain-postgres
    environment:
      DATABASE_URL: postgres://gbrain:gbrain@gbrain-postgres:5432/gbrain
      VOYAGE_API_KEY: ${VOYAGE_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # --- Custom / self-hosted endpoint (optional) ---
      # Point at an OpenAI- or Anthropic-compatible gateway instead of the
      # public API. entrypoint.sh auto-appends /v1 if you forget it
      # (works around gbrain issue #1250 — bare host causes a 404).
      # ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      SYNC_INTERVAL: ${SYNC_INTERVAL:-60}
      # --- Autopilot daemon ---
      # Set AUTOPILOT_ENABLED=true to run gbrain autopilot in the background.
      AUTOPILOT_ENABLED: ${AUTOPILOT_ENABLED:-false}
      # --- Private brain repo over SSH ---
      # SSH remote URL for the brain repo. The entrypoint sets it as origin
      # and makes the current branch track it so `gbrain sync` can pull & push.
      BRAIN_REMOTE: ${BRAIN_REMOTE:-}
      # Force git to use a writable known_hosts (the ~/.ssh mount below is :ro).
      GIT_SSH_COMMAND: "ssh -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile=/tmp/known_hosts"
    ports:
      - "7333:7333"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - gbrain-data:/data/brain
      # Mount host SSH keys read-only so the container can auth to the private
      # repo. Linux host: ${HOME} resolves to the user running compose.
      - ${HOME}/.ssh:/root/.ssh:ro
    networks:
      - gbrain-network

volumes:
  gbrain-postgres-data:
  gbrain-data:

networks:
  gbrain-network: